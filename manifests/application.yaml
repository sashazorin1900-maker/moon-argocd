apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: moon
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://charts.aerokube.ru
    chart: moon2
    targetRevision: 2.8.1

    helm:
      valueFiles:
        - moon-values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: moon

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
